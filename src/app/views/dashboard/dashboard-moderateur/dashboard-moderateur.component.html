<h2 class="title">Bienvenue Modérateur</h2>

<div class="cards">
  <div class="card" *ngFor="let stat of stats">
    <h3>{{ stat.label }}</h3>
    <p>{{ stat.value }}</p>
  </div>
</div>

<h2 class="title">Statistiques de modération</h2>

<div class="charts">
  <div class="chart-container">
    <h4>Articles validés / jour</h4>
    <canvas baseChart
      [data]="validatedChartData"
      [labels]="dates"
      [options]="chartOptions"
      [type]="'bar'">
    </canvas>
  </div>

  <div class="chart-container">
    <h4>Articles à valider</h4>
    <canvas baseChart
      [data]="pendingChartData"
      [labels]="dates"
      [options]="chartOptions"
      [type]="'line'">
    </canvas>
  </div>

  <div class="chart-container">
    <h4>Vue globale de la modération</h4>
    <canvas baseChart
      [data]="globalChartData"
      [labels]="dates"
      [options]="chartOptions"
      [type]="'bar'">
    </canvas>
  </div>
</div>
