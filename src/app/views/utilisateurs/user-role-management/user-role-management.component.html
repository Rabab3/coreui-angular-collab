<div class="role-wrapper">
  <h2 class="titre-centre"><span class="emoji-shield">🛡️</span> Gérer les rôles</h2>
  <div class="filters">
    <input
      type="text"
      placeholder="🔍 Rechercher par nom ou prénom"
      [(ngModel)]="recherche"
      (input)="filtrer()" />
    <select [(ngModel)]="filtreRole" (change)="filtrer()">
      <option value="">Tous les rôles</option>
      <option *ngFor="let role of roles" [value]="role">{{ role | titlecase }}</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th></th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Email</th>
        <th>Rôle</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of utilisateursFiltres">
        <td>
          <div class="avatar">{{ user.prenom.charAt(0) }}{{ user.nom.charAt(0) }}</div>
        </td>
        <td>{{ user.nom }}</td>
        <td>{{ user.prenom }}</td>
        <td>{{ user.email }}</td>
        <td>
          <select [(ngModel)]="user.role" (change)="changerRole(user.id, user.role)"
            [ngClass]="user.role">
            <option *ngFor="let role of roles" [value]="role">{{ role | titlecase }}</option>
          </select>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="showToast" class="toast-role">Rôle mis à jour !</div>
</div>
