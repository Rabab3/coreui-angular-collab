<div class="container mt-4">
    <h2 class="mb-3">Mes contributions</h2>

    <div class="d-flex justify-content-between mb-3 flex-wrap gap-2">
        <input
                type="text"
                class="form-control w-25"
                [(ngModel)]="searchText"
                placeholder="Rechercher..."
        />
        <div>
            <button class="btn btn-outline-danger me-2" (click)="exportPDF()">📄 PDF</button>
            <button class="btn btn-outline-success" (click)="exportExcel()">📊 Excel</button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered text-center align-middle shadow">
            <thead class="table-dark">
            <tr>
                <th>Titre</th>
                <th *ngIf="role === 'moderateur'">Auteur</th>
                <th>Statut</th>
                <th>Date</th>
                <th *ngIf="role === 'moderateur'">Actions</th>
            </tr>
            </thead>
            <tbody>
            <!-- ✅ Message si aucune contribution -->
            <tr *ngIf="filteredArticles.length === 0">
                <td colspan="5" class="text-muted">Aucune contribution trouvée.</td>
            </tr>

            <!-- ✅ Liste des articles -->
            <ng-container *ngFor="let article of filteredArticles">
                <tr>
                    <td>{{ article.titre }}</td>
                    <td *ngIf="role === 'moderateur'">{{ article.auteur }}</td>
                    <td>
              <span [ngClass]="{
                'badge bg-warning text-dark': article.statut === 'EN_ATTENTE',
                'badge bg-success': article.statut === 'VALIDE',
                'badge bg-secondary': article.statut === 'A_CORRIGER'
              }">
                {{ getStatutLabel(article.statut) }}
              </span>
                    </td>
                    <td>{{ article.date | date:'dd/MM/yyyy' }}</td>
                    <td *ngIf="role === 'moderateur'">
                        <button class="btn btn-success btn-sm me-1" (click)="changerStatut(article, 'VALIDE')">Valider</button>
                        <button class="btn btn-warning btn-sm me-1" (click)="changerStatut(article, 'A_CORRIGER')">Retourner</button>
                        <button class="btn btn-info btn-sm">Voir</button>
                    </td>
                </tr>

                <!-- Commentaire de retour -->
                <tr *ngIf="article.statut === 'A_CORRIGER' && article.retourCommentaire">
                    <td colspan="5" class="text-start bg-light text-danger">
                        <strong>🔁 Commentaire de retour :</strong> {{ article.retourCommentaire }}
                    </td>
                </tr>
            </ng-container>
            </tbody>
        </table>
    </div>
</div>
