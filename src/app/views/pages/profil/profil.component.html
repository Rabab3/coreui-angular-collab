<div class="profile-wrapper">
  <div class="profile-card">
    <h2 class="profile-title">Mon Profil</h2>

    <div class="profile-left">
      <div class="avatar-container" [ngClass]="userData.role">
        <img *ngIf="photoUrl" [src]="photoUrl" alt="Photo de profil" />
        <div *ngIf="!photoUrl" class="initials-avatar">{{ initials }}</div>
      </div>

      <label class="custom-file-upload">
        📷 Changer la photo
        <input type="file" accept="image/*" (change)="onPhotoSelected($event)" />
      </label>

      <button *ngIf="photoUrl" class="delete-photo-btn" (click)="onDeletePhoto()">
        🗑️ Supprimer la photo
      </button>

      <span class="role-badge" [ngClass]="userData.role">
        <ng-container [ngSwitch]="userData.role">
          <span *ngSwitchCase="'admin'">🛡️ Admin</span>
          <span *ngSwitchCase="'moderateur'">🔵 Modérateur</span>
          <span *ngSwitchCase="'contributeur'">🟢 Contributeur</span>
          <span *ngSwitchCase="'lecteur'">🟠 Lecteur</span>
          <span *ngSwitchDefault>👤</span>
        </ng-container>
      </span>
    </div>

    <div class="profile-right">
      <div class="profile-info-grid">
        <div class="info-block">
          <label><i class="fa fa-user gradient-icon"></i> <strong>Nom :</strong></label>
          <span>{{ userData.nom }}</span>
        </div>
        <div class="info-block">
          <label><i class="fa fa-user gradient-icon"></i> <strong>Prénom :</strong></label>
          <span>{{ userData.prenom }}</span>
        </div>
        <div class="info-block">
          <label><i class="fa fa-envelope gradient-icon"></i> <strong>Email :</strong></label>
          <span>{{ userData.email }}</span>
        </div>
        <div class="info-block">
          <label><i class="fa fa-phone gradient-icon"></i> <strong>Numéro :</strong></label>
          <span>{{ userData.telephone }}</span>
        </div>
        <div class="info-block">
          <label><i class="fa fa-calendar gradient-icon"></i> <strong>Date de naissance :</strong></label>
          <span>{{ userData.dateNaissance }}</span>
        </div>
        <div class="info-block">
          <label><i class="fa fa-id-card gradient-icon"></i> <strong>CIN :</strong></label>
          <span>{{ userData.cin }}</span>
        </div>
        
        <div class="info-block">
          <label><i class="fa fa-building gradient-icon"></i> <strong>Département :</strong></label>
          <span>{{ userData.departement }}</span>
        </div>
        <div class="info-block full">
          <label><i class="fa fa-user-circle gradient-icon"></i> <strong>Nom d'utilisateur :</strong></label>
          <span>{{ userData.username }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
